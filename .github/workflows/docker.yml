name: Docker submission check

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with the submitted weights
        run: docker build --target test -t photonics-doe-test .
      - name: Build the submission image
        run: docker build -t photonics-doe .
      - name: Run offline inference on all example quartets
        run: |
          mkdir -p output
          docker run --rm --network none -v "$PWD/output:/output" photonics-doe --input-dir /app/examples --output-dir /output
          test "$(find output -name '*.png' | wc -l)" -eq 8
